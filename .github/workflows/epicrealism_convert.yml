name: Convert epiCRealism

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Model type to convert (standard, lcm, or both)'
        default: 'both'
        required: true
        type: choice
        options:
          - both
          - standard
          - lcm
      attention_implementation:
        description: 'Attention implementation (ORIGINAL chunked → GPU path, proven recipe on iPhone 15 Pro Max)'
        default: 'ORIGINAL'
        required: true
        type: choice
        options:
          - ORIGINAL
          - SPLIT_EINSUM
      resolution:
        description: 'Latent resolution. 512x512 is the sweet spot for ORIGINAL chunked.'
        default: '512x512'
        required: true
        type: choice
        options:
          - 512x512
          - 512x768
          - 768x512
          - 768x768
      quantize_nbits:
        description: 'Weight quantization (none=FP16). Start with none to validate; quantize later.'
        default: 'none'
        required: true
        type: choice
        options:
          - 'none'
          - '8'
          - '6'
          - '4'

jobs:
  convert:
    name: Convert epiCRealism (macOS, compiled .mlmodelc)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          sw_vers
          xcodebuild -version
          sysctl hw.memsize hw.ncpu

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Verbatim dep set from the previously-working Ubuntu workflow. Every entry has a
          # transitive importer somewhere in coremltools / diffusers / ml-stable-diffusion — do
          # not trim. (Specifically: pytest + scikit-learn pulled in via
          # coremltools.converters.mil.testing_utils, used by chunk_mlprogram.py.)
          pip install 'coremltools>=7.1,<8' 'numpy<1.27' 'huggingface_hub==0.25.2' \
            'diffusers==0.27.2' 'transformers==4.40.0' torch torchvision \
            'peft==0.11.1' accelerate hf_transfer safetensors requests scipy \
            pytest scikit-learn invisible-watermark matplotlib diffusionkit

      - name: Clone Apple ml-stable-diffusion
        run: git clone --depth 1 https://github.com/apple/ml-stable-diffusion.git ml-stable-diffusion

      - name: Install ml-stable-diffusion package
        run: pip install --no-deps -e ml-stable-diffusion

      - name: Install aria2 (project policy for multi-GB downloads)
        run: brew install aria2

      - name: Download model weights via aria2c
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scratch/download_via_aria2.py \
            jzli/epiCRealism-v3 \
            scratch/jzli_epiCRealism-v3 \
            --ignore '*.safetensors'
          python scratch/download_via_aria2.py \
            latent-consistency/lcm-lora-sdv1-5 \
            scratch/latent-consistency_lcm-lora-sdv1-5

      - name: Run Conversion (Standard)
        if: ${{ inputs.model_type == 'standard' || inputs.model_type == 'both' }}
        run: |
          python scratch/convert_epicrealism.py \
            --model-type standard \
            --attention-implementation ${{ inputs.attention_implementation }} \
            --resolution ${{ inputs.resolution }} \
            --quantize-nbits ${{ inputs.quantize_nbits }}

      - name: Run Conversion (LCM)
        if: ${{ inputs.model_type == 'lcm' || inputs.model_type == 'both' }}
        run: |
          python scratch/convert_epicrealism.py \
            --model-type lcm \
            --attention-implementation ${{ inputs.attention_implementation }} \
            --resolution ${{ inputs.resolution }} \
            --quantize-nbits ${{ inputs.quantize_nbits }}

      - name: Show final bundle contents
        run: |
          for d in epicrealism_standard epicrealism_lcm; do
            if [ -d "$d" ]; then
              echo "=== $d ==="
              ls -la "$d"
              du -sh "$d"
            fi
          done
          ls -la epicrealism_*.zip 2>/dev/null || true

      - name: Upload compiled .mlmodelc bundles
        uses: actions/upload-artifact@v4
        with:
          name: epicrealism_mlmodelc_${{ inputs.attention_implementation }}_${{ inputs.resolution }}_${{ inputs.quantize_nbits }}
          path: epicrealism_*.zip
          if-no-files-found: error
          retention-days: 14
