name: SD Dual Convert

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which model(s) to convert
        default: both
        type: choice
        options: [both, t2i, inpaint]

jobs:
  t2i:
    if: ${{ inputs.kind == 't2i' || inputs.kind == 'both' }}
    name: T2I (base SD 1.5 + LCM-LoRA)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install 'coremltools>=7.1,<8' 'numpy<1.27' 'huggingface_hub>=0.25' 'diffusers==0.27.2' 'transformers==4.40.0' torch torchvision peft accelerate hf_transfer safetensors requests scipy
      - name: Clone Apple ml-stable-diffusion
        run: git clone --depth 1 https://github.com/apple/ml-stable-diffusion.git ml-stable-diffusion
      - name: Install ml-stable-diffusion package
        run: pip install --no-deps -e ml-stable-diffusion
      - name: Download HF sources
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
        run: python scratch/dl_models_ci.py
      - name: Run T2I conversion
        run: python scratch/convert_t2i_lcm.py
      - uses: actions/upload-artifact@v4
        with:
          name: sd_models_t2i
          path: sd_models_t2i.zip
          if-no-files-found: error
          retention-days: 7

  inpaint:
    if: ${{ inputs.kind == 'inpaint' || inputs.kind == 'both' }}
    name: Inpaint (pure sd-1.5-inpainting, no LoRA)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install 'coremltools>=7.1,<8' 'numpy<1.27' 'huggingface_hub>=0.25' 'diffusers==0.27.2' 'transformers==4.40.0' torch torchvision peft accelerate hf_transfer safetensors requests scipy
      - name: Clone Apple ml-stable-diffusion
        run: git clone --depth 1 https://github.com/apple/ml-stable-diffusion.git ml-stable-diffusion
      - name: Install ml-stable-diffusion package
        run: pip install --no-deps -e ml-stable-diffusion
      - name: Download HF sources
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
        run: python scratch/dl_models_ci.py
      - name: Run Inpaint conversion
        run: python scratch/convert_inpaint.py
      - uses: actions/upload-artifact@v4
        with:
          name: sd_models_inpaint
          path: sd_models_inpaint.zip
          if-no-files-found: error
          retention-days: 7
