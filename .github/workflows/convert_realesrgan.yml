name: Convert Real-ESRGAN x4plus to CoreML

on:
  workflow_dispatch:

jobs:
  convert-model:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 coremltools==7.2 'numpy<1.27'

      - name: Run Real-ESRGAN CoreML Conversion
        run: |
          python scratch/convert_realesrgan.py

      - name: Archive Real-ESRGAN mlpackage
        run: |
          if [ -d "scratch/RealESRGAN_x4plus.mlpackage" ]; then
            zip -r RealESRGAN_x4plus_mlpackage.zip scratch/RealESRGAN_x4plus.mlpackage
          else
            echo "❌ RealESRGAN_x4plus.mlpackage not found!"
            exit 1
          fi

      - name: Archive Compiled Real-ESRGAN mlmodelc
        run: |
          if [ -d "scratch/RealESRGAN_x4plus.mlmodelc" ]; then
            zip -r RealESRGAN_x4plus_mlmodelc.zip scratch/RealESRGAN_x4plus.mlmodelc
          else
            echo "⚠️ RealESRGAN_x4plus.mlmodelc not found (compile step skipped?)"
          fi

      - name: Upload mlpackage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN-x4plus-mlpackage
          path: RealESRGAN_x4plus_mlpackage.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload mlmodelc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN-x4plus-mlmodelc
          path: RealESRGAN_x4plus_mlmodelc.zip
          if-no-files-found: warn
          retention-days: 7
