name: Convert LaMa Model to CoreML

on:
  workflow_dispatch:
    inputs:
      compile_model:
        description: 'Compile the model using Xcode (requires macOS runner)'
        required: true
        type: boolean
        default: true

jobs:
  convert-model:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          echo "Checking Xcode version..."
          xcodebuild -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install coremltools, torch, timm, scipy, numpy, and iopaint for LaMa model
          pip install torch==2.2.0 coremltools==7.2 timm scipy 'numpy<1.27' huggingface-hub==0.23.1 diffusers==0.27.2 iopaint==1.3.3


      - name: Run LaMa CoreML Conversion
        run: |
          python scratch/convert_lama.py

      - name: Archive LaMa mlpackage
        run: |
          if [ -d "scratch/LaMa.mlpackage" ]; then
            echo "Zipping LaMa.mlpackage..."
            zip -r LaMa_mlpackage.zip scratch/LaMa.mlpackage
          else
            echo "❌ LaMa.mlpackage not found!"
            exit 1
          fi

      - name: Archive Compiled LaMa mlmodelc
        if: ${{ inputs.compile_model }}
        run: |
          if [ -d "scratch/LaMa.mlmodelc" ]; then
            echo "Zipping LaMa.mlmodelc..."
            zip -r LaMa_mlmodelc.zip scratch/LaMa.mlmodelc
          else
            echo "⚠️ LaMa.mlmodelc not found or not compiled!"
          fi

      - name: Upload CoreML Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaMa-CoreML-Package
          path: LaMa_mlpackage.zip
          retention-days: 7

      - name: Upload Compiled Modelc Artifact
        if: ${{ inputs.compile_model }}
        uses: actions/upload-artifact@v4
        with:
          name: LaMa-Compiled-Modelc
          path: LaMa_mlmodelc.zip
          retention-days: 7
